defaults:
  - ../config/traj_envs@_here_
  - ../config/deepspeed_zero@_here_
  - ../config/deepspeed_zero2@_here_
  - ../config/deepspeed_zero3@_here_
  - ../config/deepspeed_zero3_cpuoffload@_here_

hydra:
  run:
    dir: .
  output_subdir: null

exp_name: "pipeline2_sokoban_grpo"
seed: 42
logging_dir: ./output/pipeline2/logs
output_dir: ./output/pipeline2
# render_save_dir: ./output/pipeline2/render
render_save_dir: /tmp/roll_output/pipeline2/render

system_envs:
  NCCL_SHM_DISABLE: "1"
  RAY_PROFILING: "1"
  RAY_DEDUP_LOGS: "0"
  RAY_TMPDIR: "${oc.env:RAY_TMPDIR,/tmp}"
  ROLL_TIMEOUT_SCALE: "0.1"
  ROLL_GPU_REQUEST_TIMEOUT_S: "120"
  ROLL_NOTIFY_READY_TIMEOUT_S: "300"
  ROLL_VERIFY_OFFLOAD_GPU_MEMORY: "1"
  ROLL_SELECTIVE_MODEL_UPDATE_PG_TIMEOUT_S: '150'  # ProcessGroup/NCCL collective watchdog timeout (ms shown in logs).
  ROLL_ROLLOUT_GET_BATCH_TIMEOUT_S: '180'
  
checkpoint_config:
  type: file_system
  # output_dir: ./output/pipeline2/checkpoints
  output_dir: /tmp/roll_output/pipeline2/checkpoints

num_gpus_per_node: 2
offload_nccl: true 
max_steps: 3
save_steps: 10000
logging_steps: 1
eval_steps: 20
resume_from_checkpoint: false

async_generation_ratio: 1

rollout_batch_size: 4
val_batch_size: 4
sequence_length: 2048
max_actions_per_traj: 5

advantage_clip: 0.2
ppo_epochs: 1
adv_estimator: "grpo"
init_kl_coef: 0.0
whiten_advantages: true
entropy_loss_coef: 0
max_grad_norm: 1.0

pretrain: Qwen/Qwen2.5-0.5B-Instruct
reward_pretrain: Qwen/Qwen2.5-0.5B-Instruct

actor_train:
  model_args:
    attn_implementation: fa2
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 0
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 2
    warmup_steps: 1
    lr_scheduler_type: cosine
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: megatron_train
    strategy_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      use_distributed_optimizer: true
      recompute_granularity: full
      sequence_parallel: true
      overlap_grad_reduce: true
  device_mapping: "[1,]"  # Pipeline 2: GPU 1
  infer_batch_size: 1

actor_infer:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: 64
    top_p: 1
    top_k: 3
    num_beams: 1
    temperature: 0.0
    num_return_sequences: 1
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: vllm
    strategy_config:
      VLLM_USE_V1: 1
      gpu_memory_utilization: 0.65
      block_size: 16
      load_format: auto
      tensor_parallel_size: 1
      max_num_batched_tokens: 2048
      max_num_seqs: 2
      enforce_eager: true
      sleep_level: 2
  device_mapping: "[0, 1, ]"  # Single-node smoke: keep actor_infer off actor_train's GPU 0

reference:
  model_args:
    attn_implementation: fa2
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: megatron_infer
    strategy_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
  device_mapping: "[1,]"  # Pipeline 2: GPU 1
  infer_batch_size: 1

reward_normalization:
  grouping: traj_group_id
  method: mean_std

train_env_manager:
  format_penalty: -0.15
  max_env_num_per_worker: 4
  num_env_groups: 2
  group_size: 2
  tags: [SimpleSokoban]
  num_groups_partition: [2]

val_env_manager:
  max_env_num_per_worker: 4
  num_env_groups: 2
  group_size: 2
  tags: [SimpleSokoban]
  num_groups_partition: [2]

max_tokens_per_step: 64

custom_envs:
  SimpleSokoban:
    ${custom_env.SimpleSokoban}
